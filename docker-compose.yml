services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: goag
      POSTGRES_USER: goag
      POSTGRES_PASSWORD: goag
    ports:
      - "5432:5432"
    volumes:
      - goag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goag -d goag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/api:/app

  worker:
    build:
      context: ./apps/worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/worker:/app

volumes:
  goag_postgres_data:

